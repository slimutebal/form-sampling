<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon-192.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sampling" />
    <script>
      (function () {
        var mode = 'system'
        try {
          var saved = window.localStorage.getItem('qps.theme-mode.v1')
          if (saved === 'light' || saved === 'dark' || saved === 'system') mode = saved
        } catch (error) {
          // Local storage can be blocked; System remains the safe default.
        }
        var theme = mode === 'system'
          ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : mode
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        var themeColor = document.querySelector('meta[name="theme-color"]')
        if (themeColor) themeColor.setAttribute('content', theme === 'dark' ? '#0d1c14' : '#f2f7f3')
      })()
    </script>
    <title>Form Sampling</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
